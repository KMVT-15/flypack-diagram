<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: two engineering drawings, each in its own horizontal scroller; box shape = kind of thing, stroke color = signal type */
:root {
  --bg: #f2f4f3;
  --fg: #1b2126;
  --muted: #5a646c;
  --panel: #ffffff;
  --patch: #e3e9ed;
  --line: #98a2a9;
  --sdi: #1d6db5;
  --hdmi: #c05d16;
  --usb: #7647bd;
  --aud: #2b8a4c;
  --net: #46515b;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
  --font-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131719; --fg: #e3e8ea; --muted: #97a1a8; --panel: #1c2226; --patch: #28323a; --line: #56616a;
    --sdi: #5aa5ee; --hdmi: #f0944c; --usb: #b28cf2; --aud: #5ccd84; --net: #aab4bb;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131719; --fg: #e3e8ea; --muted: #97a1a8; --panel: #1c2226; --patch: #28323a; --line: #56616a;
  --sdi: #5aa5ee; --hdmi: #f0944c; --usb: #b28cf2; --aud: #5ccd84; --net: #aab4bb;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); }
.wrap { max-width: 1400px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 40px; display: grid; gap: 26px; }
header { display: grid; gap: 10px; }
h1 { font: 700 1.9rem/1.1 var(--font-display); letter-spacing: 0.01em; margin: 0; }
h2 { font: 600 1.1rem/1.2 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font: 500 0.85rem/1 var(--font-body); margin: 0; padding: 0; list-style: none; }
.legend li { display: flex; align-items: center; gap: 7px; }
.sw { width: 26px; height: 0; border-top: 3px solid var(--fg); }
.sw.sdi { border-color: var(--sdi); } .sw.hdmi { border-color: var(--hdmi); } .sw.usb { border-color: var(--usb); }
.sw.aud { border-color: var(--aud); } .sw.net { border-color: var(--net); } .sw.wl { border-top-style: dotted; border-color: var(--usb); }
.k-dev { width: 24px; height: 15px; border: 1.5px solid var(--fg); background: var(--panel); border-radius: 2px; }
.k-patch { width: 24px; height: 15px; border: 1.5px solid var(--line); background: var(--patch); border-radius: 8px; }
.k-opt { width: 24px; height: 15px; border: 1.5px dashed var(--fg); background: var(--panel); border-radius: 2px; }
figure { margin: 0; display: grid; gap: 8px; }
.scroll { overflow-x: auto; border-top: 1px solid var(--line); padding-block: 10px; }
.scroll svg { display: block; width: 100%; height: auto; color: var(--fg); }
.net-svg { min-width: 760px; max-width: 1000px; }
.av-svg { min-width: 1130px; }

/* SVG classes */
.dev { fill: var(--panel); stroke: var(--fg); stroke-width: 1.4; }
.opt { fill: var(--panel); stroke: var(--fg); stroke-width: 1.4; stroke-dasharray: 5 4; }
.patch { fill: var(--patch); stroke: var(--line); stroke-width: 1.2; }
.w { fill: none; stroke-width: 2.2; stroke-linejoin: round; }
.w.sdi { stroke: var(--sdi); } .w.hdmi { stroke: var(--hdmi); } .w.usb { stroke: var(--usb); }
.w.aud { stroke: var(--aud); } .w.net { stroke: var(--net); }
.w.any { stroke: var(--net); stroke-dasharray: 5 4; stroke-width: 1.5; }
.w.wl { stroke: var(--usb); stroke-dasharray: 2 4; stroke-linecap: round; }
.mk-sdi { fill: var(--sdi); } .mk-hdmi { fill: var(--hdmi); } .mk-usb { fill: var(--usb); } .mk-aud { fill: var(--aud); }
.dot { fill: var(--fg); }
.t { font: 500 12px var(--font-body); fill: var(--fg); }
.tb { font: 600 13px var(--font-body); fill: var(--fg); }
.sub { font: 400 10.5px var(--font-mono); fill: var(--muted); }
.port { font: 500 11.5px var(--font-mono); fill: var(--fg); }
.ip { font: 500 11px var(--font-mono); fill: var(--muted); }
.ttl { font: 700 14px var(--font-display); letter-spacing: 0.02em; fill: var(--fg); }
</style>
